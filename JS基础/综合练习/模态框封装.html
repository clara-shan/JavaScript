<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .modal {
      width: 300px;
      min-height: 100px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      position: fixed;
      z-index: 999;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0);
      background-color: #fff;
    }

    .modal .header {
      line-height: 40px;
      padding: 0 10px;
      position: relative;
      font-size: 20px;
    }

    .modal .header i {
      font-style: normal;
      color: #999;
      position: absolute;
      right: 15px;
      top: -2px;
      cursor: pointer;
    }

    .modal .body {
      text-align: center;
      padding: 10px;
    }

    .modal .footer {
      display: flex;
      justify-content: flex-end;
      padding: 10px;
    }

    .modal .footer a {
      padding: 3px 8px;
      background: #ccc;
      text-decoration: none;
      color: #fff;
      border-radius: 2px;
      margin-right: 10px;
      font-size: 14px;
    }

    .modal .footer a.submit {
      background-color: #369;
    }
  </style>
</head>

<body>
  <button id="delete">删除</button>
  <button id="login">登录</button>

  <!-- <div class="modal">
    <div class="header">温馨提示 <i>x</i></div>
    <div class="body">您没有删除权限操作</div>
  </div> -->

  <script>
    // 构造函数 方便新建多个属性相同的实例 不用重复写代码
    function Modal(title = '', message = '') {
      // this指向new出来的实例对象 要给实例新建属性一定要写this.属性
      this.title = title
      this.message = message
      this.modalBox = document.createElement('div')
      this.modalBox.className = 'modal'
    }
    Modal.prototype.open = function () {
      this.modalBox.innerHTML = `
        <div class="header">${this.title}<i>x</i></div>
        <div class="body">${this.message}</div>
      `

      const box = document.querySelector('.modal')
      // 逻辑中断  有.modal就移除，没有就往下执行
      box && box.remove()

      document.body.append(this.modalBox)

      // 点击x删除只能在.modal盒子添加到页面中时才能执行
      this.modalBox.querySelector('i').addEventListener('click', () => this.close())
    }

    Modal.prototype.close = function () {
      this.modalBox.remove()
    }

    document.querySelector('#delete').addEventListener('click', () => {
      const del = new Modal('温馨提示', '您没有删除权限操作')
      del.open()
    })

    document.querySelector('#login').addEventListener('click', () => {
      const login = new Modal('友情提示', '您还没有注册账号')
      login.open()
    })
  </script>
</body>

</html>
