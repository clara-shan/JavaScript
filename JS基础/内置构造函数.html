<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
  </ul>
  <div></div>
  <script>
    // Object
    const o = { uname: 'pink', age: 18 }
    console.log(Object.keys(o))  // 获得对象里的属性名
    console.log(Object.values(o))  // 获得对象里的属性值
    // 拷贝对象o里面的数据
    const oo = {}
    Object.assign(oo, o)
    console.log(oo)

    const spec = { size: '40cm*40cm', color: '黑色' }
    console.log(Object.values(spec))
    document.write(Object.values(spec).join('/'))

    // Array    sort() forEach() filter() map() join() reduce() find() every()
    // reduce() 数组中所有数据的累加和 没有初始值就写0，尽量写上初始值
    const arr = [1, 2, 3, 4, 5]
    const total = arr.reduce((prev, current) => prev + current, 0)
    console.log(total)
    const total1 = arr.reduce((prev, current) => prev + current, 10)
    console.log(total1)
    const arr1 = [{
      name: '张三',
      salary: 10000
    },
    {
      name: '李四',
      salary: 10000
    },
    {
      name: '王五',
      salary: 20000
    }]
    const total2 = arr1.reduce((prev, current) => prev + current.salary, 0)
    console.log(total2)
    // 工资涨30%
    const total3 = arr1.reduce((prev, current) => prev + current.salary * 1.3, 0)
    console.log(total3)

    // find()
    const arr3 = [
      {
        name: '小米',
        price: 1999
      },
      {
        name: '华为',
        price: 3999
      },
      {
        name: '小米10',
        price: 3999
      }
    ]
    const mi = arr3.find(item => item.name === '小米')  // 只会返回name='小米'的第一组数据
    console.log(mi)

    // every()  与filter()的区别是filter返回筛选后的新数组
    const arr4 = [10, 40, 60, 80]
    const flag = arr4.every(item => item > 20)  // 只要有一个数据小于等于20就返回true
    console.log(flag)

    // some()
    const arr5 = [1, 2, 3, 4, 25]
    const flag1 = arr5.some(item => item > 20)  // 只要有一个数据大于20就返回true
    console.log(flag1)

    // concat()  把数组内容拼接到一起并返回新数组
    const arr6 = arr4.concat(arr5)
    console.log(arr6)

    // Array.from()  把伪数组转换为新数组
    const lis = document.querySelectorAll('ul li')
    console.log(lis)
    arr5.push(3)
    console.log(arr5)
    // lis.push(3)
    const lis1 = Array.from(lis)
    lis1.push(3)
    console.log(lis1)


    // String
    // split()  把字符串转化为数组
    const str = '喜之郎，多点关心多点爱'
    console.log(str.split('，'))
    const str2 = "2026-8-17"
    console.log(str2.split('-'))

    const gift = '50g的茶叶,清洗球'
    const arr8 = gift.split(',')
    console.log(arr8)
    document.querySelector('div').innerHTML = arr8.map(item => `<span>【赠品】${item}</span> </br>`).join('')

    // substring() 截取字符串
    console.log(str.substring(4))

    // startWith()
    console.log(str.startsWith('喜'))
    // endsWith()
    console.log(str2.endsWith('8'))

    // includes()
    console.log(str.includes('你'))


    // Number
    // toFixed() 设置保留小数位的长度，四舍五入
    const num = 12.975
    const num2 = 12.432
    console.log(num.toFixed(1))
    console.log(num2.toFixed(1))
  </script>
</body>

</html>
