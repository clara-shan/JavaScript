<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button>点击</button>

  <script>
    // 普通函数this指向调用者，谁调用，this就指向谁
    const obj = {
      name: '张三',
      age: 18,
      hobby: function () {
        console.log(this)  // this指向obj
      }
    }
    // obj.hobby()  // 打印出来的是obj对象本身

    document.querySelector('button').addEventListener('click', function () {
      console.log(this)  // 指向button
    })

    // 箭头函数中不存在this，它会自动绑定外层this的值
    document.querySelector('button').addEventListener('click', () => console.log(this))


    // 改变this
    // call(指定的this值，传递的参数，传递的参数)
    function fn(x, y) {
      console.log(this)
      return x + y
    }
    console.log(fn.call(obj, 1, 2))

    // apply(指定的this值,[传递的参数])  传递的值必须包含在数组里面
    console.log(fn.apply(obj, [1, 2]))

    // 求数组最大值
    const arr = [1, 29, 3, 56, 76, 8]
    console.log(Math.max.apply(null, arr))  // null代表函数内部this指向全局，Math.max内部不关心this是谁  把arr拆成一个个参数传给函数
    console.log(Math.max(...arr))

    // bind(this值，传递的参数，传递的参数)  不调用函数  返回一个新函数(由指定的 this 值和初始化参数改造的 原函数拷贝)
    const fun = fn.bind(obj, 1, 3)
    console.log(fun())
    fun()
  </script>
</body>

</html>
